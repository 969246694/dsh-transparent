# Bundle patch for dsh-transparent.
#
# Same shape as dsh-glass-ui: this row points at the HOST half (the package
# name). It must never point at `dsh-transparent/client` - that resolves to a
# classic browser script, which the host cannot import; the failure surfaces as
# a bare "failed to import" that says nothing about the real cause.
#
# The browser half is located through package.json exports["./client"] and
# delivered to the page by the /plugins bundle route.
#
# Keep this file pure ASCII: a `//` first line (invalid in YAML) and full-width
# punctuation in these comments broke the overlay parser once already.

- insert:
    - id: transparent
      name: "dsh-transparent"
      # alpha: whole-window opacity applied by the host half at startup.
      #   255 = do not fade the window at all (content stays crisp)
      #   215 = wallpaper visible, content slightly faded  <- default
      #   150 = wallpaper obvious, content clearly faded
      #
      # darkTheme: pin the interface to the dark theme on activation.
      #   Translucency over a light interface looks washed out, so this defaults
      #   to true. It writes the durable `ui-theme.preference` setting through
      #   the settings service; uninstalling the plugin does NOT put the
      #   previous value back, so set this to false to leave the theme alone.
      #
      # updateCheck: ask the registry once per start whether a newer version
      #   exists, and say so in the console if it does. One small request, and a
      #   failure is silent. Skipped entirely unless the package is installed
      #   under node_modules, so a working copy is never checked.
      #
      #   This only reports. Nothing in the application announces a new version
      #   on its own, which is the whole reason for the check; installing one is
      #   a reinstall in the GUI, or install_bundle <name> on the command line.
      #
      # updateSource: override where the version is read from. Point it at any
      #   URL serving {"version":"x.y.z"} (the plugin appends /latest). Useful
      #   when the registry is unreachable, e.g. behind a slow or blocked route.
      config:
        alpha: 215
        darkTheme: true
        updateCheck: true
        updateSource: ""


